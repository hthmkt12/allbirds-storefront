name: CI & Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  storefront-ci:
    name: Storefront Lint, Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Storefront Dependencies
        run: npm ci

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Production Build
        run: npm run build

  cms-ci:
    name: Payload CMS Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'payload-cms/package-lock.json'

      - name: Install CMS Dependencies
        working-directory: ./payload-cms
        run: npm ci

      - name: Build Payload CMS
        working-directory: ./payload-cms
        run: npm run build

  e2e-ci:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [storefront-ci, cms-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Storefront Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Storefront for E2E
        run: npm run build

      - name: Run E2E Tests (Chromium)
        run: npx playwright test -c e2e-tests/playwright.config.ts --project=chromium --workers=1

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-tests/playwright-report/
          retention-days: 14
