    prompt: |
      Lập kế hoạch sửa các vấn đề Frontend & UI/UX đã phát hiện:
      1. Responsive PDP layout: Chuyển inline grid sang class `.pdp-container` trong `src/styles.css` và responsive `1fr` trên mobile.
      2. Dynamic size selection: Loại bỏ hardcoded size 9 trong `src/components/wishlist-drawer.tsx` và size 8 trong `src/components/cart-drawer.tsx`.
