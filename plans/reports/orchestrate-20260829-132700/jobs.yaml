    cwd: C:/Users/manhpc/orca/workspaces/Allbirds/catfish
    prompt: |
      Lập kế hoạch triển khai EmDash Backend trên Cloudflare Workers + D1 (`allbirds-emdash-db`):
      1. Thiết lập D1 Schema: Bảng cho 6 collections (`heroBlocks`, `categories`, `products`, `promoTiles`, `materials`, `reviews`) và bảng `orders`.
