      3. Viết `POST /api/orders` (server-side validation/tax/totals) và hoàn thiện `GET /api/orders/lookup?email=&token=`.
      4. Script seed dữ liệu vào D1 từ `src/data/allbirds-data.ts`.
      Trả về kiến trúc routes, schema D1 và các bước triển khai.
