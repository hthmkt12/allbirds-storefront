services:
  - type: web
    name: allbirds-payload-cms
    runtime: docker
    dockerfilePath: ./payload-cms/Dockerfile
    dockerContext: ./payload-cms
    plan: starter
    region: singapore
    disk:
      name: cms_data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /app/data/payload.db
      - key: PORT
        value: 3000
